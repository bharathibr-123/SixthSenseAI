<svg width="1200" height="880" viewBox="0 0 1200 880" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="hC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00e5ff"/></marker>
    <marker id="hA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffab00"/></marker>
    <marker id="hW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888888"/></marker>
    <marker id="hG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00e676"/></marker>
  </defs>

  <rect x="0" y="0" width="1200" height="880" fill="#0a0a0a"/>

  <text x="600" y="40" fill="#ffffff" font-family="Arial, sans-serif" font-size="27" font-weight="700" text-anchor="middle">SixthSense AI — hardware setup</text>
  <text x="600" y="63" fill="#9e9e9e" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">Camera, edge device and cloud — one physical install per vehicle</text>

  <!-- ============ LEFT: In-vehicle hardware ============ -->
  <rect x="40" y="90" width="680" height="600" rx="14" fill="none" stroke="#00e5ff" stroke-width="1.2" stroke-dasharray="6,5"/>
  <text x="64" y="115" fill="#00e5ff" font-family="Arial, sans-serif" font-size="13" font-weight="700">In-vehicle hardware unit</text>

  <!-- Camera -->
  <rect x="372" y="140" width="16" height="30" fill="#00e5ff"/>
  <rect x="340" y="170" width="80" height="40" rx="8" fill="#001a1f" stroke="#00e5ff" stroke-width="1.5"/>
  <circle cx="395" cy="190" r="13" fill="#000000" stroke="#00e5ff" stroke-width="1.5"/>
  <text x="380" y="234" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">1080p IR camera</text>
  <text x="380" y="250" fill="#9e9e9e" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle">Dashboard or mirror-mounted</text>

  <line x1="380" y1="210" x2="380" y2="350" stroke="#00e5ff" stroke-width="2" marker-end="url(#hC)"/>

  <!-- Edge AI compute unit (hub) -->
  <rect x="270" y="350" width="220" height="100" rx="10" fill="#1a0020" stroke="#d500f9" stroke-width="1.5"/>
  <text x="380" y="388" fill="#ffffff" font-family="Arial, sans-serif" font-size="14.5" font-weight="700" text-anchor="middle">Edge AI compute unit</text>
  <text x="380" y="408" fill="#9e9e9e" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle">Raspberry Pi 4 / Jetson Nano class</text>
  <text x="380" y="423" fill="#9e9e9e" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle">runs detection model on-device</text>

  <!-- Speaker / buzzer -->
  <line x1="490" y1="400" x2="598" y2="400" stroke="#ffab00" stroke-width="2" marker-end="url(#hA)"/>
  <rect x="600" y="385" width="16" height="30" fill="#1f1400" stroke="#ffab00" stroke-width="1.5"/>
  <path d="M622 390 Q640 400 622 410" fill="none" stroke="#ffab00" stroke-width="1.5"/>
  <path d="M630 380 Q656 400 630 420" fill="none" stroke="#ffab00" stroke-width="1.5"/>
  <text x="620" y="450" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Speaker / buzzer</text>
  <text x="620" y="466" fill="#9e9e9e" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle">Local alert output</text>

  <!-- GPS + 4G module -->
  <line x1="380" y1="450" x2="380" y2="575" stroke="#00e5ff" stroke-width="2" marker-end="url(#hC)"/>
  <path d="M380 575 L370 555 L390 550 L380 535" fill="none" stroke="#00e5ff" stroke-width="1.5"/>
  <rect x="310" y="575" width="140" height="65" rx="8" fill="#001a1f" stroke="#00e5ff" stroke-width="1.5"/>
  <text x="380" y="602" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">GPS + 4G module</text>
  <text x="380" y="619" fill="#9e9e9e" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Location + connectivity</text>
  <text x="380" y="660" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Syncs opportunistically</text>
  <text x="380" y="675" fill="#9e9e9e" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle">whenever signal is available</text>

  <!-- Vehicle power -->
  <line x1="270" y1="400" x2="200" y2="400" stroke="#888888" stroke-width="2" marker-end="url(#hW)"/>
  <rect x="130" y="350" width="6" height="15" fill="#888888"/>
  <rect x="145" y="350" width="6" height="15" fill="#888888"/>
  <rect x="80" y="365" width="120" height="70" rx="8" fill="#151515" stroke="#888888" stroke-width="1.5"/>
  <text x="140" y="452" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Vehicle power</text>
  <text x="140" y="468" fill="#9e9e9e" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle">12V / OBD-II, always-on</text>

  <!-- ============ RIGHT: Cloud + connected devices ============ -->
  <rect x="760" y="90" width="400" height="600" rx="14" fill="none" stroke="#d500f9" stroke-width="1.2" stroke-dasharray="6,5"/>
  <text x="784" y="115" fill="#d500f9" font-family="Arial, sans-serif" font-size="13" font-weight="700">Cloud and connected devices</text>

  <!-- Wireless signal from GPS/4G to cloud -->
  <line x1="450" y1="560" x2="905" y2="255" stroke="#00e5ff" stroke-width="1.6" stroke-dasharray="8,6" marker-end="url(#hC)"/>
  <path d="M500 545 Q520 520 545 505" fill="none" stroke="#00e5ff" stroke-width="1.2"/>
  <path d="M540 500 Q565 470 595 452" fill="none" stroke="#00e5ff" stroke-width="1.2"/>

  <!-- Cloud icon -->
  <circle cx="930" cy="235" r="34" fill="#2a0040"/>
  <circle cx="970" cy="215" r="44" fill="#2a0040"/>
  <circle cx="1005" cy="238" r="30" fill="#2a0040"/>
  <rect x="915" y="228" width="110" height="42" rx="20" fill="#2a0040"/>
  <text x="965" y="305" fill="#ffffff" font-family="Arial, sans-serif" font-size="14.5" font-weight="700" text-anchor="middle">Cloud backend</text>
  <text x="965" y="323" fill="#9e9e9e" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle">Flask API + SQLite/PostgreSQL</text>
  <text x="965" y="339" fill="#9e9e9e" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle">scales per fleet size</text>

  <!-- Laptop: Fleet manager -->
  <line x1="920" y1="330" x2="850" y2="435" stroke="#00e676" stroke-width="2" marker-end="url(#hG)"/>
  <rect x="810" y="440" width="80" height="55" rx="4" fill="#00190d" stroke="#00e676" stroke-width="1.5"/>
  <polygon points="800,495 900,495 890,505 810,505" fill="#00190d" stroke="#00e676" stroke-width="1.5"/>
  <text x="850" y="525" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Fleet manager</text>
  <text x="850" y="541" fill="#9e9e9e" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle">Web dashboard</text>

  <!-- Phone: Driver -->
  <line x1="1000" y1="330" x2="1050" y2="435" stroke="#00e676" stroke-width="2" marker-end="url(#hG)"/>
  <rect x="1025" y="440" width="50" height="90" rx="10" fill="#00190d" stroke="#00e676" stroke-width="1.5"/>
  <circle cx="1050" cy="518" r="4" fill="#00e676"/>
  <text x="1050" y="555" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Driver</text>
  <text x="1050" y="571" fill="#9e9e9e" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle">Mobile app</text>

  <!-- ============ Legend ============ -->
  <circle cx="330" cy="712" r="6" fill="#00e5ff"/>
  <text x="344" y="717" fill="#cfcfcf" font-family="Arial, sans-serif" font-size="12">Video / sensor data</text>

  <circle cx="500" cy="712" r="6" fill="#ffab00"/>
  <text x="514" y="717" fill="#cfcfcf" font-family="Arial, sans-serif" font-size="12">Local alert signal</text>

  <circle cx="660" cy="712" r="6" fill="#888888"/>
  <text x="674" y="717" fill="#cfcfcf" font-family="Arial, sans-serif" font-size="12">Power</text>

  <circle cx="760" cy="712" r="6" fill="#00e676"/>
  <text x="774" y="717" fill="#cfcfcf" font-family="Arial, sans-serif" font-size="12">Cloud to app delivery</text>

  <!-- ============ Spec notes ============ -->
  <text x="60" y="752" fill="#cfcfcf" font-family="Arial, sans-serif" font-size="13">• Camera: 1080p, IR-capable for low-light and night driving, mounted on the dashboard or rear-view mirror.</text>
  <text x="60" y="776" fill="#cfcfcf" font-family="Arial, sans-serif" font-size="13">• Edge compute: Raspberry Pi 4 or Jetson Nano class device — the full detection model runs on-device, so alerts never depend on the cloud.</text>
  <text x="60" y="800" fill="#cfcfcf" font-family="Arial, sans-serif" font-size="13">• Connectivity: 4G LTE + GPS module syncs event and location data to the cloud opportunistically, whenever signal is available.</text>
  <text x="60" y="824" fill="#cfcfcf" font-family="Arial, sans-serif" font-size="13">• Power: draws from the vehicle's 12V supply via OBD-II, active for as long as the ignition is on.</text>
  <text x="60" y="848" fill="#cfcfcf" font-family="Arial, sans-serif" font-size="13">• Cloud: Flask API backend with a Scikit-learn scoring model, on SQLite for local dev or PostgreSQL in production.</text>
</svg>
