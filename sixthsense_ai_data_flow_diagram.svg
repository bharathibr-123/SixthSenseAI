<svg width="1200" height="1180" viewBox="0 0 1200 1180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00e5ff"/></marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d500f9"/></marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffab00"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00e676"/></marker>
    <marker id="arrW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888888"/></marker>
  </defs>

  <rect x="0" y="0" width="1200" height="1180" fill="#0a0a0a"/>

  <text x="600" y="40" fill="#ffffff" font-family="Arial, sans-serif" font-size="27" font-weight="700" text-anchor="middle">SixthSense AI — data flow diagram</text>
  <text x="600" y="63" fill="#9e9e9e" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">What data moves between processes, stores and external systems</text>

  <!-- Entity: Driver + camera -->
  <rect x="490" y="100" width="220" height="60" fill="#151515" stroke="#888888" stroke-width="1.5"/>
  <text x="600" y="135" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Driver + camera</text>

  <line x1="600" y1="160" x2="600" y2="200" stroke="#00e5ff" stroke-width="2" marker-end="url(#arrC)"/>
  <text x="612" y="184" fill="#00e5ff" font-family="Arial, sans-serif" font-size="10.5">video frames</text>

  <!-- Process 1.0 -->
  <rect x="470" y="200" width="260" height="90" rx="18" fill="#001a1f" stroke="#00e5ff" stroke-width="1.5"/>
  <text x="600" y="235" fill="#ffffff" font-family="Arial, sans-serif" font-size="14.5" font-weight="700" text-anchor="middle">1.0  Detect driver state</text>
  <text x="600" y="255" fill="#9e9e9e" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle">Edge AI — runs fully offline</text>
  <text x="600" y="270" fill="#9e9e9e" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle">on the vehicle device</text>

  <line x1="600" y1="290" x2="380" y2="350" stroke="#00e5ff" stroke-width="2" marker-end="url(#arrC)"/>
  <text x="410" y="315" fill="#00e5ff" font-family="Arial, sans-serif" font-size="10.5">detection event</text>

  <line x1="600" y1="290" x2="780" y2="350" stroke="#d500f9" stroke-width="2" marker-end="url(#arrP)"/>
  <text x="700" y="315" fill="#d500f9" font-family="Arial, sans-serif" font-size="10.5">event + confidence</text>

  <!-- Process 2.0 -->
  <rect x="260" y="350" width="240" height="90" rx="18" fill="#001a1f" stroke="#00e5ff" stroke-width="1.5"/>
  <text x="380" y="385" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">2.0  Trigger local alert</text>
  <text x="380" y="405" fill="#9e9e9e" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle">Voice (KN/HI/EN) + buzzer,</text>
  <text x="380" y="420" fill="#9e9e9e" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle">fires instantly, no network needed</text>

  <!-- Process 3.0 -->
  <rect x="650" y="350" width="260" height="90" rx="18" fill="#1a0020" stroke="#d500f9" stroke-width="1.5"/>
  <text x="780" y="385" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">3.0  Log and sync event</text>
  <text x="780" y="405" fill="#9e9e9e" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle">Attaches GPS, driver ID</text>
  <text x="780" y="420" fill="#9e9e9e" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle">and vehicle ID</text>

  <!-- Entity: GPS module -->
  <rect x="960" y="360" width="180" height="70" fill="#151515" stroke="#888888" stroke-width="1.5"/>
  <text x="1050" y="400" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">GPS module</text>
  <line x1="960" y1="395" x2="910" y2="395" stroke="#888888" stroke-width="2" marker-end="url(#arrW)"/>
  <text x="912" y="388" fill="#9e9e9e" font-family="Arial, sans-serif" font-size="10">location + speed</text>

  <!-- Data store D1 -->
  <line x1="650" y1="490" x2="910" y2="490" stroke="#cfcfcf" stroke-width="1.5"/>
  <line x1="650" y1="560" x2="910" y2="560" stroke="#cfcfcf" stroke-width="1.5"/>
  <line x1="650" y1="490" x2="650" y2="560" stroke="#cfcfcf" stroke-width="1.5"/>
  <text x="780" y="520" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">D1</text>
  <text x="780" y="540" fill="#cfcfcf" font-family="Arial, sans-serif" font-size="11.5" text-anchor="middle">Driver event log</text>

  <line x1="780" y1="440" x2="780" y2="490" stroke="#d500f9" stroke-width="2" marker-end="url(#arrP)"/>
  <text x="792" y="470" fill="#d500f9" font-family="Arial, sans-serif" font-size="10">event record</text>

  <!-- Process 3.0 -> Process 5.0 critical flag -->
  <line x1="650" y1="395" x2="520" y2="610" stroke="#ffab00" stroke-width="2" marker-end="url(#arrA)"/>
  <text x="475" y="500" fill="#ffab00" font-family="Arial, sans-serif" font-size="10.5">critical event flag</text>

  <!-- Process 4.0 -->
  <rect x="650" y="610" width="260" height="90" rx="18" fill="#1a0020" stroke="#d500f9" stroke-width="1.5"/>
  <text x="780" y="645" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">4.0  Compute fleet analytics</text>
  <text x="780" y="665" fill="#9e9e9e" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle">Risk scoring and trend</text>
  <text x="780" y="680" fill="#9e9e9e" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle">detection across the fleet</text>

  <line x1="780" y1="560" x2="780" y2="610" stroke="#d500f9" stroke-width="2" marker-end="url(#arrP)"/>
  <text x="792" y="590" fill="#d500f9" font-family="Arial, sans-serif" font-size="10">historical events</text>

  <!-- Entity: Weather service -->
  <rect x="960" y="620" width="180" height="70" fill="#151515" stroke="#888888" stroke-width="1.5"/>
  <text x="1050" y="660" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Weather service</text>
  <line x1="960" y1="655" x2="910" y2="655" stroke="#888888" stroke-width="2" marker-end="url(#arrW)"/>
  <text x="912" y="648" fill="#9e9e9e" font-family="Arial, sans-serif" font-size="10">route conditions</text>

  <!-- Data store D2 -->
  <line x1="650" y1="750" x2="910" y2="750" stroke="#cfcfcf" stroke-width="1.5"/>
  <line x1="650" y1="820" x2="910" y2="820" stroke="#cfcfcf" stroke-width="1.5"/>
  <line x1="650" y1="750" x2="650" y2="820" stroke="#cfcfcf" stroke-width="1.5"/>
  <text x="780" y="780" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">D2</text>
  <text x="780" y="800" fill="#cfcfcf" font-family="Arial, sans-serif" font-size="11.5" text-anchor="middle">Fleet analytics</text>

  <line x1="780" y1="700" x2="780" y2="750" stroke="#d500f9" stroke-width="2" marker-end="url(#arrP)"/>
  <text x="792" y="730" fill="#d500f9" font-family="Arial, sans-serif" font-size="10">aggregated scores</text>

  <!-- Process 5.0 -->
  <rect x="260" y="610" width="260" height="90" rx="18" fill="#1f1400" stroke="#ffab00" stroke-width="1.5"/>
  <text x="390" y="645" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">5.0  Send emergency alert</text>
  <text x="390" y="665" fill="#9e9e9e" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle">Fires only on danger-level</text>
  <text x="390" y="680" fill="#9e9e9e" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle">events, e.g. severe drowsiness</text>

  <!-- Entity: WhatsApp / Twilio -->
  <rect x="40" y="610" width="180" height="70" fill="#151515" stroke="#888888" stroke-width="1.5"/>
  <text x="130" y="640" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">WhatsApp /</text>
  <text x="130" y="658" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Twilio</text>
  <line x1="260" y1="650" x2="220" y2="650" stroke="#ffab00" stroke-width="2" marker-end="url(#arrA)"/>
  <text x="120" y="600" fill="#ffab00" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">SOS message</text>

  <!-- Entity: Fleet manager (alert) -->
  <rect x="40" y="750" width="180" height="70" fill="#151515" stroke="#888888" stroke-width="1.5"/>
  <text x="130" y="780" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Fleet manager</text>
  <text x="130" y="798" fill="#9e9e9e" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">(alert notification)</text>
  <line x1="300" y1="700" x2="150" y2="750" stroke="#ffab00" stroke-width="2" marker-end="url(#arrA)"/>
  <text x="200" y="735" fill="#ffab00" font-family="Arial, sans-serif" font-size="10">notification</text>

  <!-- D1 -> Process 6.0, routed via left corridor to avoid crossing boxes -->
  <path d="M650 525 L600 525 L600 870" fill="none" stroke="#00e676" stroke-width="2" marker-end="url(#arrG)"/>
  <text x="500" y="700" fill="#00e676" font-family="Arial, sans-serif" font-size="10.5">driver history</text>

  <!-- D2 -> Process 6.0 -->
  <line x1="700" y1="820" x2="680" y2="870" stroke="#00e676" stroke-width="2" marker-end="url(#arrG)"/>
  <text x="700" y="850" fill="#00e676" font-family="Arial, sans-serif" font-size="10">fleet trends</text>

  <!-- Process 6.0 -->
  <rect x="470" y="870" width="260" height="90" rx="18" fill="#00190d" stroke="#00e676" stroke-width="1.5"/>
  <text x="600" y="905" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">6.0  Serve app data</text>
  <text x="600" y="925" fill="#9e9e9e" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle">Combines driver history and</text>
  <text x="600" y="940" fill="#9e9e9e" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle">fleet trends per requesting user</text>

  <line x1="530" y1="960" x2="380" y2="1000" stroke="#00e676" stroke-width="2" marker-end="url(#arrG)"/>
  <text x="400" y="985" fill="#00e676" font-family="Arial, sans-serif" font-size="10">live status and trips</text>

  <line x1="670" y1="960" x2="820" y2="1000" stroke="#00e676" stroke-width="2" marker-end="url(#arrG)"/>
  <text x="700" y="985" fill="#00e676" font-family="Arial, sans-serif" font-size="10">safety score and alerts</text>

  <!-- Entity: Fleet manager dashboard -->
  <rect x="230" y="1000" width="260" height="70" fill="#151515" stroke="#888888" stroke-width="1.5"/>
  <text x="360" y="1030" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Fleet manager</text>
  <text x="360" y="1048" fill="#9e9e9e" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">(web dashboard)</text>

  <!-- Entity: Driver mobile app -->
  <rect x="700" y="1000" width="260" height="70" fill="#151515" stroke="#888888" stroke-width="1.5"/>
  <text x="830" y="1030" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Driver</text>
  <text x="830" y="1048" fill="#9e9e9e" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">(mobile app)</text>

  <!-- ============ NEW: Personalized calibration (bonus feature) ============ -->
  <line x1="600" y1="290" x2="960" y2="150" stroke="#d500f9" stroke-width="2" marker-end="url(#arrP)"/>
  <text x="770" y="205" fill="#d500f9" font-family="Arial, sans-serif" font-size="10">session baseline EAR/MAR</text>

  <rect x="960" y="100" width="180" height="100" rx="18" fill="#1a0020" stroke="#d500f9" stroke-width="1.5"/>
  <text x="1050" y="135" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">7.0  Calibrate</text>
  <text x="1050" y="150" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">thresholds</text>
  <text x="1050" y="170" fill="#9e9e9e" font-family="Arial, sans-serif" font-size="9.5" text-anchor="middle">Learns per-driver EAR/MAR</text>
  <text x="1050" y="184" fill="#9e9e9e" font-family="Arial, sans-serif" font-size="9.5" text-anchor="middle">baseline after 5 sessions</text>

  <line x1="1050" y1="200" x2="1050" y2="230" stroke="#d500f9" stroke-width="2" marker-end="url(#arrP)"/>

  <line x1="1050" y1="230" x2="1050" y2="80" stroke="#d500f9" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="1050" y1="80" x2="650" y2="80" stroke="#d500f9" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="650" y1="80" x2="650" y2="198" stroke="#d500f9" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrP)"/>
  <text x="820" y="72" fill="#d500f9" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">personalized thresholds (feedback, every 5th session)</text>

  <line x1="1040" y1="230" x2="1040" y2="260" stroke="#cfcfcf" stroke-width="1.5"/>
  <line x1="960" y1="230" x2="1140" y2="230" stroke="#cfcfcf" stroke-width="1.5"/>
  <line x1="960" y1="300" x2="1140" y2="300" stroke="#cfcfcf" stroke-width="1.5"/>
  <line x1="960" y1="230" x2="960" y2="300" stroke="#cfcfcf" stroke-width="1.5"/>
  <text x="1050" y="260" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">D3</text>
  <text x="1050" y="280" fill="#cfcfcf" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Calibration samples</text>

  <!-- ============ NEW: Accident risk prediction (bonus feature) ============ -->
  <line x1="910" y1="525" x2="958" y2="510" stroke="#d500f9" stroke-width="2" marker-end="url(#arrP)"/>

  <rect x="960" y="460" width="180" height="100" rx="18" fill="#1a0020" stroke="#d500f9" stroke-width="1.5"/>
  <text x="1050" y="495" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">8.0  Predict</text>
  <text x="1050" y="510" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">accident risk</text>
  <text x="1050" y="530" fill="#9e9e9e" font-family="Arial, sans-serif" font-size="9.5" text-anchor="middle">Random Forest — probability</text>
  <text x="1050" y="544" fill="#9e9e9e" font-family="Arial, sans-serif" font-size="9.5" text-anchor="middle">of a lapse in next 30 min</text>

  <path d="M1050 560 L1050 585 L935 585 L935 870 L715 870" fill="none" stroke="#00e676" stroke-width="2" marker-end="url(#arrG)"/>
  <text x="990" y="700" fill="#00e676" font-family="Arial, sans-serif" font-size="10">risk probability</text>

  <!-- Legend -->
  <circle cx="330" cy="1110" r="6" fill="#00e5ff"/>
  <text x="344" y="1115" fill="#cfcfcf" font-family="Arial, sans-serif" font-size="12">Offline path</text>

  <circle cx="460" cy="1110" r="6" fill="#d500f9"/>
  <text x="474" y="1115" fill="#cfcfcf" font-family="Arial, sans-serif" font-size="12">Cloud sync path</text>

  <circle cx="610" cy="1110" r="6" fill="#ffab00"/>
  <text x="624" y="1115" fill="#cfcfcf" font-family="Arial, sans-serif" font-size="12">Emergency path</text>

  <circle cx="760" cy="1110" r="6" fill="#00e676"/>
  <text x="774" y="1115" fill="#cfcfcf" font-family="Arial, sans-serif" font-size="12">App delivery path</text>

  <line x1="900" y1="1110" x2="924" y2="1110" stroke="#d500f9" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="932" y="1115" fill="#cfcfcf" font-family="Arial, sans-serif" font-size="12">Adaptive feedback (periodic)</text>

  <text x="600" y="1150" fill="#9e9e9e" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Rectangles = external entities · rounded boxes = processes · open boxes = data stores</text>
</svg>
