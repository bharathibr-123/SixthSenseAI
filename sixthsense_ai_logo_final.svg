  <text x="190" y="365" fill="#ffffff" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">Primary icon — full color</text>
  <text x="530" y="365" fill="#ffffff" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">Monochrome — white (dark bg)</text>
  <text x="870" y="365" fill="#ffffff" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">Monochrome — black (light bg)</text>

  <!-- ============ Row 2: Horizontal lockup ============ -->
  <rect x="40" y="405" width="980" height="200" rx="16" fill="#000000" stroke="#1a1a1a" stroke-width="1"/>

  <g>
    <path d="M106 442 Q106 421 150 421 Q194 421 194 442 L194 500 Q194 525 150 546 Q106 525 106 500 Z"
