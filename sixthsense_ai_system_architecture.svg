<svg width="1200" height="1000" viewBox="0 0 1200 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#00e5ff"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d500f9"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ffab00"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#00e676"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="1000" fill="#0a0a0a"/>

  <text x="600" y="42" fill="#ffffff" font-family="Arial, sans-serif" font-size="27" font-weight="700" text-anchor="middle">SixthSense AI — system architecture</text>
  <text x="600" y="66" fill="#9e9e9e" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">Edge AI inference, cloud sync and multi-channel fleet alerting</text>

  <!-- ============ ROW 1: Vehicle / edge layer ============ -->
  <rect x="260" y="100" width="680" height="250" rx="14" fill="none" stroke="#00e5ff" stroke-width="1.2" stroke-dasharray="6,5"/>
  <text x="284" y="126" fill="#00e5ff" font-family="Arial, sans-serif" font-size="13" font-weight="700">Vehicle / edge layer</text>

  <rect x="440" y="135" width="220" height="75" rx="8" fill="#001a1f" stroke="#00e5ff" stroke-width="1.5"/>
  <text x="550" y="167" fill="#ffffff" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Camera module</text>
  <text x="550" y="187" fill="#9e9e9e" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Dash / cabin mounted</text>

  <rect x="440" y="245" width="220" height="85" rx="8" fill="#001a1f" stroke="#00e5ff" stroke-width="1.5"/>
  <text x="550" y="272" fill="#ffffff" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Edge AI engine</text>
  <text x="550" y="292" fill="#9e9e9e" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle">Drowsiness, yawn, distraction,</text>
  <text x="550" y="307" fill="#9e9e9e" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle">stress detection — runs offline</text>

  <rect x="720" y="245" width="180" height="85" rx="8" fill="#001a1f" stroke="#00e5ff" stroke-width="1.5"/>
  <text x="810" y="272" fill="#ffffff" font-family="Arial, sans-serif" font-size="14.5" font-weight="700" text-anchor="middle">Local alert output</text>
  <text x="810" y="292" fill="#9e9e9e" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle">Voice: Kannada / Hindi /</text>
  <text x="810" y="307" fill="#9e9e9e" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle">English, plus in-cab buzzer</text>

  <line x1="550" y1="210" x2="550" y2="245" stroke="#00e5ff" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <line x1="660" y1="287" x2="720" y2="287" stroke="#00e5ff" stroke-width="2" marker-end="url(#arrowCyan)"/>

  <!-- ============ ROW 2: Connectivity layer ============ -->
  <rect x="260" y="390" width="680" height="90" rx="14" fill="none" stroke="#00e5ff" stroke-width="1.2" stroke-dasharray="6,5"/>
  <text x="284" y="416" fill="#00e5ff" font-family="Arial, sans-serif" font-size="13" font-weight="700">Connectivity layer</text>

  <rect x="440" y="412" width="220" height="60" rx="8" fill="#001a1f" stroke="#00e5ff" stroke-width="1.5"/>
  <text x="550" y="447" fill="#ffffff" font-family="Arial, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle">4G / GPS sync module</text>

  <line x1="550" y1="330" x2="550" y2="412" stroke="#00e5ff" stroke-width="2" marker-end="url(#arrowCyan)"/>

  <!-- ============ ROW 3: Cloud backend layer ============ -->
  <rect x="140" y="520" width="920" height="160" rx="14" fill="none" stroke="#d500f9" stroke-width="1.2" stroke-dasharray="6,5"/>
  <text x="164" y="546" fill="#d500f9" font-family="Arial, sans-serif" font-size="13" font-weight="700">Cloud backend layer</text>

  <rect x="180" y="555" width="220" height="90" rx="8" fill="#1a0020" stroke="#d500f9" stroke-width="1.5"/>
  <text x="290" y="590" fill="#ffffff" font-family="Arial, sans-serif" font-size="14.5" font-weight="700" text-anchor="middle">Database</text>
  <text x="290" y="609" fill="#9e9e9e" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle">SQLite / PostgreSQL</text>

  <rect x="440" y="555" width="220" height="90" rx="8" fill="#1a0020" stroke="#d500f9" stroke-width="1.5"/>
  <text x="550" y="590" fill="#ffffff" font-family="Arial, sans-serif" font-size="14.5" font-weight="700" text-anchor="middle">API server</text>
  <text x="550" y="609" fill="#9e9e9e" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle">Flask API + Scikit-learn</text>

  <rect x="700" y="555" width="220" height="90" rx="8" fill="#1a0020" stroke="#d500f9" stroke-width="1.5"/>
  <text x="810" y="590" fill="#ffffff" font-family="Arial, sans-serif" font-size="14.5" font-weight="700" text-anchor="middle">Analytics engine</text>
  <text x="810" y="609" fill="#9e9e9e" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle">Fleet risk scoring</text>

  <line x1="550" y1="472" x2="550" y2="555" stroke="#d500f9" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <line x1="440" y1="600" x2="400" y2="600" stroke="#d500f9" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <line x1="660" y1="600" x2="700" y2="600" stroke="#d500f9" stroke-width="2" marker-end="url(#arrowPurple)"/>

  <!-- ============ ROW 4: External services + Applications ============ -->
  <rect x="60" y="750" width="500" height="130" rx="14" fill="none" stroke="#ffab00" stroke-width="1.2" stroke-dasharray="6,5"/>
  <text x="84" y="776" fill="#ffab00" font-family="Arial, sans-serif" font-size="13" font-weight="700">External services layer</text>

  <rect x="90" y="795" width="200" height="70" rx="8" fill="#1f1400" stroke="#ffab00" stroke-width="1.5"/>
  <text x="190" y="826" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">WhatsApp alert API</text>
  <text x="190" y="844" fill="#9e9e9e" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Emergency SOS messages</text>

  <rect x="330" y="795" width="200" height="70" rx="8" fill="#1f1400" stroke="#ffab00" stroke-width="1.5"/>
  <text x="430" y="826" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Weather API</text>
  <text x="430" y="844" fill="#9e9e9e" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Route risk conditions</text>

  <rect x="620" y="750" width="520" height="130" rx="14" fill="none" stroke="#00e676" stroke-width="1.2" stroke-dasharray="6,5"/>
  <text x="644" y="776" fill="#00e676" font-family="Arial, sans-serif" font-size="13" font-weight="700">Applications layer</text>

  <rect x="650" y="795" width="220" height="70" rx="8" fill="#00190d" stroke="#00e676" stroke-width="1.5"/>
  <text x="760" y="826" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Fleet manager dashboard</text>
  <text x="760" y="844" fill="#9e9e9e" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Web — React</text>

  <rect x="890" y="795" width="220" height="70" rx="8" fill="#00190d" stroke="#00e676" stroke-width="1.5"/>
  <text x="1000" y="826" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Driver mobile app</text>
  <text x="1000" y="844" fill="#9e9e9e" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Android — Expo</text>

  <!-- Fan-out arrows from API server to all four consumers -->
  <line x1="550" y1="645" x2="190" y2="795" stroke="#d500f9" stroke-width="1.6" marker-end="url(#arrowPurple)"/>
  <line x1="550" y1="645" x2="430" y2="795" stroke="#d500f9" stroke-width="1.6" marker-end="url(#arrowPurple)"/>
  <line x1="550" y1="645" x2="760" y2="795" stroke="#d500f9" stroke-width="1.6" marker-end="url(#arrowPurple)"/>
  <line x1="550" y1="645" x2="1000" y2="795" stroke="#d500f9" stroke-width="1.6" marker-end="url(#arrowPurple)"/>

  <!-- ============ Legend ============ -->
  <circle cx="380" cy="920" r="6" fill="#00e5ff"/>
  <text x="394" y="925" fill="#cfcfcf" font-family="Arial, sans-serif" font-size="12">Edge / vehicle</text>

  <circle cx="520" cy="920" r="6" fill="#d500f9"/>
  <text x="534" y="925" fill="#cfcfcf" font-family="Arial, sans-serif" font-size="12">Cloud backend</text>

  <circle cx="660" cy="920" r="6" fill="#ffab00"/>
  <text x="674" y="925" fill="#cfcfcf" font-family="Arial, sans-serif" font-size="12">External services</text>

  <circle cx="820" cy="920" r="6" fill="#00e676"/>
  <text x="834" y="925" fill="#cfcfcf" font-family="Arial, sans-serif" font-size="12">Client applications</text>

  <!-- ============ Footer note ============ -->
  <text x="600" y="965" fill="#00e5ff" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Camera → edge AI → local alert works fully offline</text>
  <text x="600" y="985" fill="#9e9e9e" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Cloud sync, fleet dashboard and analytics update opportunistically whenever connectivity is available</text>
</svg>
